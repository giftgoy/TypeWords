name: typewords

services:
  typewords:
    build:
      context: .
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    image: typewords:local
    container_name: typewords
    ports:
      - "127.0.0.1:5567:80"
    restart: unless-stopped
    depends_on:
      tts:
        condition: service_healthy
      data:
        condition: service_healthy
      reading:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      # 每日自动拉取的文章（articles 容器写入），nginx 直接静态托管
      - typewords-feed:/usr/share/nginx/html/dicts/en/article/feed:ro

  tts:
    build: ./deploy/tts
    image: typewords-tts:local
    container_name: typewords-tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  reading:
    build: ./deploy/reading
    image: typewords-reading:local
    container_name: typewords-reading
    ports:
      - "127.0.0.1:5568:8000"
    restart: unless-stopped
    volumes:
      - typewords-reading:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # 共享学习数据：所有浏览器/设备通过 /api/data 读写同一份 SQLite（存在 typewords-data 卷里，重建容器不丢）
  data:
    build: ./deploy/data
    image: typewords-data:local
    container_name: typewords-data
    restart: unless-stopped
    env_file:
      - path: ./deploy/.env
        required: false
    environment:
      DATA_FILE: /data/learning.sqlite3
    volumes:
      - typewords-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # 每日文章拉取：Wikinews / Simple Wikipedia / Project Gutenberg，写入 feed 卷
  articles:
    build: ./deploy/articles
    image: typewords-articles:local
    container_name: typewords-articles
    restart: unless-stopped
    environment:
      FEED_DIR: /feed
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-mymemory}
      TRANSLATE_ENABLED: ${TRANSLATE_ENABLED:-1}
      DAILY_COUNT: ${DAILY_COUNT:-3}
      MAX_PER_BOOK: ${MAX_PER_BOOK:-200}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-22} # UTC 22 = 北京时间次日 06:00
      RUN_ON_START: ${RUN_ON_START:-1}
    volumes:
      - typewords-feed:/feed

volumes:
  typewords-reading:
  typewords-data:
  typewords-feed:
