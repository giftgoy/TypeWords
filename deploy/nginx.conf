server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;   # 目录 301 用相对 Location，避免丢掉宿主端口
    port_in_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 自然人声服务，仅通过站点同源访问，不额外暴露宿主机端口
    location ^~ /api/tts/ {
        resolver 127.0.0.11 valid=10s;
        set $tts_upstream http://tts:8000;
        rewrite ^/api/tts/(.*)$ /$1 break;
        proxy_pass $tts_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        access_log off;
    }

    # 共享学习数据服务（同一套部署，多浏览器共用一份进度）
    location ^~ /api/reading/ {
        resolver 127.0.0.11 valid=10s;
        set $reading_upstream http://reading:8000;
        rewrite ^/api/reading/(.*)$ /$1 break;
        proxy_pass $reading_upstream;
        proxy_set_header Host $http_host;
        client_max_body_size 256k;
        proxy_read_timeout 180s;
        access_log off;
    }

    location ^~ /api/data/ {
        resolver 127.0.0.11 valid=10s;
        set $data_upstream http://data:8000;
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass $data_upstream;
        # 服务端会校验 Origin 与 Host 是否同源；变量 proxy_pass 默认把 Host 改成上游名，这里恢复原 Host
        proxy_set_header Host $http_host;
        client_max_body_size 128m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        access_log off;
    }

    # 静态资源长缓存
    location ~* \.(js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 预渲染页面 + SPA 回退
    location / {
        try_files $uri $uri/index.html $uri/ /200.html;
    }
}
